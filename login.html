<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Login · Segurança Pública Pará</title>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@300;400;600;700&family=Source+Code+Pro:wght@400;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="firebase-config.js"></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#050d08; --bg2:#0a1a0d; --bg3:#0f2214;
  --border:#163520; --border2:#1f4a2c;
  --green:#4ade80; --green2:#22c55e; --forest:#166534;
  --red:#f87171; --txt:#dcfce7; --txt2:#86efac; --muted:#3d6b4a;
  --font:'Source Sans 3',sans-serif; --mono:'Source Code Pro',monospace;
}
body{font-family:var(--font);background:var(--bg);color:var(--txt);height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden}
.login-box{width:min(360px,calc(100% - 40px));background:var(--bg3);border:1px solid var(--border);border-radius:14px;padding:32px 28px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.login-logo{display:flex;align-items:center;justify-content:center;margin-bottom:18px}
.login-logo img{height:52px;width:auto;object-fit:contain}
.login-box h1{font-size:15px;font-weight:700;color:#bbf7d0;text-align:center;line-height:1.3}
.login-box p{font-size:10.5px;color:var(--muted);text-align:center;margin-top:4px;margin-bottom:22px}
.field{margin-bottom:14px}
.field label{display:block;font-size:9px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.field input{width:100%;background:var(--bg);border:1px solid var(--border2);border-radius:8px;color:var(--txt);font-family:var(--font);font-size:12.5px;padding:10px 12px;outline:none;transition:border-color .2s}
.field input:focus{border-color:var(--green2)}
.btn-login{width:100%;margin-top:6px;padding:11px;border-radius:8px;border:1px solid var(--green2);background:var(--forest);color:var(--txt);font-family:var(--font);font-size:12px;font-weight:700;cursor:pointer;transition:all .2s}
.btn-login:hover{background:var(--green2)}
.btn-login:disabled{opacity:.6;cursor:default}
.login-error{margin-top:12px;padding:9px 11px;border-radius:8px;background:rgba(248,113,113,.1);border-left:2px solid var(--red);color:#fecaca;font-size:11px;line-height:1.5;display:none}
.login-status{margin-top:14px;text-align:center;font-size:10px;color:var(--muted)}
</style>
</head>
<body>

<div class="login-box">
  <div class="login-logo"><img src="logo.png" alt="Logo"></div>
  <h1>Segurança Pública · Pará</h1>
  <p>Faça login para acessar o dashboard</p>

  <form id="login-form">
    <div class="field">
      <label for="login-email">E-mail</label>
      <input type="email" id="login-email" autocomplete="username" required>
    </div>
    <div class="field">
      <label for="login-password">Senha</label>
      <input type="password" id="login-password" autocomplete="current-password" required>
    </div>
    <button type="submit" class="btn-login" id="btn-login">Entrar</button>
    <div class="login-error" id="login-error"></div>
  </form>
  <div class="login-status" id="login-status">Verificando sessão...</div>
</div>

<script>
const byId=id=>document.getElementById(id);

function showError(msg){
  const el=byId('login-error');
  el.textContent=msg;
  el.style.display='block';
}
function hideError(){
  byId('login-error').style.display='none';
}
function messageForError(code){
  const map={
    'auth/invalid-email':'E-mail inválido.',
    'auth/user-disabled':'Usuário desabilitado.',
    'auth/user-not-found':'Usuário ou senha incorretos.',
    'auth/wrong-password':'Usuário ou senha incorretos.',
    'auth/invalid-credential':'Usuário ou senha incorretos.',
    'auth/too-many-requests':'Muitas tentativas. Aguarde alguns minutos e tente novamente.'
  };
  return map[code]||'Não foi possível fazer login. Tente novamente.';
}

byId('login-form').addEventListener('submit',e=>{
  e.preventDefault();
  hideError();
  const email=byId('login-email').value.trim();
  const password=byId('login-password').value;
  const btn=byId('btn-login');
  btn.disabled=true;btn.textContent='Entrando...';
  firebase.auth().signInWithEmailAndPassword(email,password)
    .then(()=>{ window.location.href='index.html'; })
    .catch(err=>{
      showError(messageForError(err.code));
      btn.disabled=false;btn.textContent='Entrar';
    });
});

firebase.auth().onAuthStateChanged(user=>{
  if(user){ window.location.href='index.html'; return; }
  byId('login-status').textContent='';
});
</script>
</body>
</html>
